services:
  mysql:
    image: mysql:8.0
    container_name: nursing-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${NURSING_MYSQL_PORT:-13306}:3306"
    volumes:
      - ./nacos/mysql-schema.sql:/docker-entrypoint-initdb.d/03_nacos_schema.sql:ro
      - ../nursing-user-service/deploy/mysql/init/01_user_schema.sql:/docker-entrypoint-initdb.d/01_user_schema.sql:ro
      - ../nursing-catalog-service/deploy/mysql/init/02_catalog_schema.sql:/docker-entrypoint-initdb.d/02_catalog_schema.sql:ro
      - ../nursing-order-service/deploy/mysql/init/03_order_schema.sql:/docker-entrypoint-initdb.d/03_order_schema.sql:ro
      - ../nursing-feedback-service/deploy/mysql/init/04_feedback_database.sql:/docker-entrypoint-initdb.d/04_feedback_database.sql:ro
      - ../nursing-operations-service/deploy/mysql/init/05_operations_schema.sql:/docker-entrypoint-initdb.d/05_operations_schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 10s
      retries: 10
      start_period: 30s
    networks:
      - nursing-net

  db-bootstrap:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      NURSING_USER_DB_USERNAME: ${NURSING_USER_DB_USERNAME:?NURSING_USER_DB_USERNAME is required}
      NURSING_USER_DB_PASSWORD: ${NURSING_USER_DB_PASSWORD:?NURSING_USER_DB_PASSWORD is required}
      NURSING_CATALOG_DB_USERNAME: ${NURSING_CATALOG_DB_USERNAME:?NURSING_CATALOG_DB_USERNAME is required}
      NURSING_CATALOG_DB_PASSWORD: ${NURSING_CATALOG_DB_PASSWORD:?NURSING_CATALOG_DB_PASSWORD is required}
      NURSING_ORDER_DB_USERNAME: ${NURSING_ORDER_DB_USERNAME:?NURSING_ORDER_DB_USERNAME is required}
      NURSING_ORDER_DB_PASSWORD: ${NURSING_ORDER_DB_PASSWORD:?NURSING_ORDER_DB_PASSWORD is required}
      NURSING_FEEDBACK_DB_USERNAME: ${NURSING_FEEDBACK_DB_USERNAME:?NURSING_FEEDBACK_DB_USERNAME is required}
      NURSING_FEEDBACK_DB_PASSWORD: ${NURSING_FEEDBACK_DB_PASSWORD:?NURSING_FEEDBACK_DB_PASSWORD is required}
      NURSING_OPERATIONS_DB_USERNAME: ${NURSING_OPERATIONS_DB_USERNAME:?NURSING_OPERATIONS_DB_USERNAME is required}
      NURSING_OPERATIONS_DB_PASSWORD: ${NURSING_OPERATIONS_DB_PASSWORD:?NURSING_OPERATIONS_DB_PASSWORD is required}
      NURSING_NACOS_DB_USERNAME: ${NURSING_NACOS_DB_USERNAME:?NURSING_NACOS_DB_USERNAME is required}
      NURSING_NACOS_DB_PASSWORD: ${NURSING_NACOS_DB_PASSWORD:?NURSING_NACOS_DB_PASSWORD is required}
    volumes:
      - ./db-bootstrap/bootstrap.sh:/bootstrap.sh:ro
      - ../nursing-user-service/deploy/mysql/init/01_user_schema.sql:/user-schema.sql:ro
      - ../nursing-order-service/deploy/mysql/init/03_order_schema.sql:/order-schema.sql:ro
      - ../nursing-operations-service/deploy/mysql/init/05_operations_schema.sql:/operations-schema.sql:ro
      - ../nursing-catalog-service/deploy/mysql/migration/20260716_repair_catalog_text.sql:/catalog-text-repair.sql:ro
      - ../nursing-catalog-service/deploy/mysql/migration/20260717_add_merchant_service_lifecycle.sql:/merchant-service-lifecycle.sql:ro
      - ../nursing-order-service/deploy/mysql/migration/20260717_repair_order_snapshot_text.sql:/order-text-repair.sql:ro
    command: ["sh", "/bootstrap.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - nursing-net

  redis:
    image: redis:7-alpine
    container_name: nursing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    networks:
      - nursing-net

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: nursing-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_DB_PARAM: "characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_SERVICE_USER: ${NURSING_NACOS_DB_USERNAME:?NURSING_NACOS_DB_USERNAME is required}
      MYSQL_SERVICE_PASSWORD: ${NURSING_NACOS_DB_PASSWORD:?NURSING_NACOS_DB_PASSWORD is required}
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/actuator/health || exit 1"]
      interval: 30s
      retries: 10
      start_period: 180s
    networks:
      - nursing-net

  kafka:
    image: confluentinc/cp-kafka:7.7.2
    container_name: nursing-kafka
    restart: unless-stopped
    depends_on: []
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      retries: 10
      start_period: 40s
    networks:
      - nursing-net

  dev-test-data:
    image: mysql:8.0
    profiles: ["seed"]
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      NURSING_SEED_CONFIRM: ${NURSING_SEED_CONFIRM:-false}
    volumes:
      - ./seed/dev-test-data.sql:/seed/dev-test-data.sql:ro
    command: ["sh", "-c", "test \"$$NURSING_SEED_CONFIRM\" = true || { echo 'Set NURSING_SEED_CONFIRM=true to load development data' >&2; exit 1; }; mysql --default-character-set=utf8mb4 -h mysql -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" < /seed/dev-test-data.sql"]
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - nursing-net

  nacos-config-bootstrap:
    image: curlimages/curl:8.10.1
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NACOS_URL: http://nacos:8848
      NURSING_NACOS_NAMESPACE: ${NURSING_NACOS_NAMESPACE:-}
    volumes:
      - ./nacos/config:/configs:ro
      - ./nacos/bootstrap-nacos-config.sh:/bootstrap-nacos-config.sh:ro
    entrypoint: ["sh", "/bootstrap-nacos-config.sh"]
    depends_on:
      nacos:
        condition: service_healthy
    networks:
      - nursing-net

  gateway:
    build:
      context: ..
      dockerfile: nursing-gateway/Dockerfile
    image: nursing/gateway:local
    container_name: nursing-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_NACOS_ADDR: nacos:8848
      NURSING_REDIS_HOST: redis
      NURSING_REDIS_PORT: 6379
      NURSING_JWT_SECRET: ${NURSING_JWT_SECRET:?NURSING_JWT_SECRET is required}
      NURSING_GATEWAY_TRUSTED_TOKEN: ${NURSING_GATEWAY_TRUSTED_TOKEN:?NURSING_GATEWAY_TRUSTED_TOKEN is required}
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8080/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  uploads-init:
    image: busybox:1.36
    restart: "no"
    command: ["sh", "-c", "mkdir -p /uploads && chown -R 10001:10001 /uploads"]
    volumes:
      - uploads-data:/uploads
    networks:
      - nursing-net

  user-service:
    build:
      context: ..
      dockerfile: nursing-user-service/Dockerfile
    image: nursing/user-service:local
    container_name: nursing-user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_USER_DB_URL: ${NURSING_USER_DB_URL:?NURSING_USER_DB_URL is required}
      NURSING_DB_USERNAME: ${NURSING_USER_DB_USERNAME:?NURSING_USER_DB_USERNAME is required}
      NURSING_DB_PASSWORD: ${NURSING_USER_DB_PASSWORD:?NURSING_USER_DB_PASSWORD is required}
      NURSING_REDIS_HOST: ${NURSING_REDIS_HOST:?NURSING_REDIS_HOST is required}
      NURSING_REDIS_PORT: ${NURSING_REDIS_PORT:?NURSING_REDIS_PORT is required}
      NURSING_NACOS_ADDR: ${NURSING_NACOS_ADDR:?NURSING_NACOS_ADDR is required}
      NURSING_NACOS_NAMESPACE: ${NURSING_NACOS_NAMESPACE:-}
      NURSING_NACOS_USERNAME: ${NURSING_NACOS_USERNAME:-}
      NURSING_NACOS_PASSWORD: ${NURSING_NACOS_PASSWORD:-}
      NURSING_JWT_SECRET: ${NURSING_JWT_SECRET:?NURSING_JWT_SECRET is required}
      NURSING_GATEWAY_TRUSTED_TOKEN: ${NURSING_GATEWAY_TRUSTED_TOKEN:?NURSING_GATEWAY_TRUSTED_TOKEN is required}
      NURSING_ID_CARD_ENCRYPTION_KEY: ${NURSING_ID_CARD_ENCRYPTION_KEY:?NURSING_ID_CARD_ENCRYPTION_KEY is required}
      NURSING_FILE_UPLOAD_DIR: /app/data/uploads
      NURSING_FILE_PUBLIC_BASE_URL: ${NURSING_FILE_PUBLIC_BASE_URL:-http://localhost/uploads}
    expose:
      - "8081"
    volumes:
      - uploads-data:/app/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
      uploads-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8081/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  catalog-service:
    build:
      context: ..
      dockerfile: nursing-catalog-service/Dockerfile
    image: nursing/catalog-service:local
    container_name: nursing-catalog-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_CATALOG_DB_URL: ${NURSING_CATALOG_DB_URL:?NURSING_CATALOG_DB_URL is required}
      NURSING_DB_USERNAME: ${NURSING_CATALOG_DB_USERNAME:?NURSING_CATALOG_DB_USERNAME is required}
      NURSING_DB_PASSWORD: ${NURSING_CATALOG_DB_PASSWORD:?NURSING_CATALOG_DB_PASSWORD is required}
      NURSING_NACOS_ADDR: nacos:8848
    expose:
      - "8082"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8082/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  order-service:
    build:
      context: ..
      dockerfile: nursing-order-service/Dockerfile
    image: nursing/order-service:local
    container_name: nursing-order-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_ORDER_DB_URL: ${NURSING_ORDER_DB_URL:?NURSING_ORDER_DB_URL is required}
      NURSING_DB_USERNAME: ${NURSING_ORDER_DB_USERNAME:?NURSING_ORDER_DB_USERNAME is required}
      NURSING_DB_PASSWORD: ${NURSING_ORDER_DB_PASSWORD:?NURSING_ORDER_DB_PASSWORD is required}
      NURSING_REDIS_HOST: redis
      NURSING_REDIS_PORT: 6379
      NURSING_NACOS_ADDR: nacos:8848
      NURSING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NURSING_GATEWAY_TRUSTED_TOKEN: ${NURSING_GATEWAY_TRUSTED_TOKEN:?NURSING_GATEWAY_TRUSTED_TOKEN is required}
      NURSING_INTERNAL_TOKEN: ${NURSING_INTERNAL_TOKEN:?NURSING_INTERNAL_TOKEN is required}
    expose:
      - "8083"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8083/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  feedback-service:
    build:
      context: ..
      dockerfile: nursing-feedback-service/Dockerfile
    image: nursing/feedback-service:local
    container_name: nursing-feedback-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_FEEDBACK_DB_URL: ${NURSING_FEEDBACK_DB_URL:?NURSING_FEEDBACK_DB_URL is required}
      NURSING_DB_USERNAME: ${NURSING_FEEDBACK_DB_USERNAME:?NURSING_FEEDBACK_DB_USERNAME is required}
      NURSING_DB_PASSWORD: ${NURSING_FEEDBACK_DB_PASSWORD:?NURSING_FEEDBACK_DB_PASSWORD is required}
      NURSING_NACOS_ADDR: nacos:8848
      NURSING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NURSING_GATEWAY_TRUSTED_TOKEN: ${NURSING_GATEWAY_TRUSTED_TOKEN:?NURSING_GATEWAY_TRUSTED_TOKEN is required}
      NURSING_INTERNAL_TOKEN: ${NURSING_INTERNAL_TOKEN:?NURSING_INTERNAL_TOKEN is required}
    expose:
      - "8084"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8084/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  operations-service:
    build:
      context: ..
      dockerfile: nursing-operations-service/Dockerfile
    image: nursing/operations-service:local
    container_name: nursing-operations-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      NURSING_OPERATIONS_DB_URL: ${NURSING_OPERATIONS_DB_URL:?NURSING_OPERATIONS_DB_URL is required}
      NURSING_DB_USERNAME: ${NURSING_OPERATIONS_DB_USERNAME:?NURSING_OPERATIONS_DB_USERNAME is required}
      NURSING_DB_PASSWORD: ${NURSING_OPERATIONS_DB_PASSWORD:?NURSING_OPERATIONS_DB_PASSWORD is required}
      NURSING_NACOS_ADDR: nacos:8848
      NURSING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NURSING_GATEWAY_TRUSTED_TOKEN: ${NURSING_GATEWAY_TRUSTED_TOKEN:?NURSING_GATEWAY_TRUSTED_TOKEN is required}
      NURSING_INTERNAL_TOKEN: ${NURSING_INTERNAL_TOKEN:?NURSING_INTERNAL_TOKEN is required}
    expose:
      - "8085"
    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      nacos-config-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8085/actuator/health"]
      interval: 15s
      retries: 10
      start_period: 60s
    networks:
      - nursing-net

  nginx:
    image: nginx:1.27-alpine
    container_name: nursing-nginx
    restart: unless-stopped
    ports:
      - "${NURSING_NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads-data:/srv/uploads:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - nursing-net

volumes:
  mysql-data:
  redis-data:
  uploads-data:

networks:
  nursing-net:
    driver: bridge
