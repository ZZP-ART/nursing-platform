logging:
  level:
     com.nursing: DEBUG

spring:
  datasource:
    url: ${NURSING_USER_DB_URL:jdbc:mysql://localhost:3306/user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${NURSING_DB_USERNAME:root}
    password: ${NURSING_DB_PASSWORD:nursing_dev_password_change_me}
  data:
    redis:
      host: ${NURSING_REDIS_HOST:localhost}
  cloud:
    nacos:
      discovery:
        server-addr: ${NURSING_NACOS_ADDR:localhost:8848}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
 
nursing:
  auth:
    allow-local-token-validation: ${NURSING_ALLOW_LOCAL_TOKEN_VALIDATION:true}
  gateway:
    trusted-token: ${NURSING_GATEWAY_TRUSTED_TOKEN:dev-gateway-token-for-nursing-platform}
  jwt:
    secret: ${NURSING_JWT_SECRET:dev-jwt-secret-for-nursing-platform-32bytes}
  security:
    id-card-key: ${NURSING_ID_CARD_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
