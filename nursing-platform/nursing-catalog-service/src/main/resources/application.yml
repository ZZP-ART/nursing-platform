server:
  port: 8082

spring:
  application:
    name: nursing-catalog-service
  datasource:
    url: ${NURSING_CATALOG_DB_URL:jdbc:mysql://mysql:3306/catalog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${NURSING_DB_USERNAME:nursing}
    password: ${NURSING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  data:
    redis:
      host: ${NURSING_REDIS_HOST:redis}
      port: ${NURSING_REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NURSING_NACOS_ADDR:nacos:8848}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nursing.catalog.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

nursing:
  snowflake:
    worker-id: 2
    datacenter-id: 1
