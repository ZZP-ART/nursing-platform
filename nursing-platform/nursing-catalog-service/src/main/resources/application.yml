 server:
   port: 8082
 
 spring:
   application:
     name: nursing-catalog-service
   datasource:
     url: jdbc:mysql://localhost:3306/catalog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
     username: root
     password: root123
     driver-class-name: com.mysql.cj.jdbc.Driver
     hikari:
       maximum-pool-size: 10
       minimum-idle: 3
   data:
     redis:
       host: localhost
       port: 6379
   cloud:
     nacos:
       discovery:
         server-addr: localhost:8848
 
 mybatis:
   mapper-locations: classpath:mapper/*.xml
   type-aliases-package: com.nursing.catalog.entity
   configuration:
     map-underscore-to-camel-case: true
     log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
 
 nursing:
   snowflake:
     worker-id: 2
     datacenter-id: 1
