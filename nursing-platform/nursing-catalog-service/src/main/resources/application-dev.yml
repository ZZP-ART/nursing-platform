logging:
  level:
    com.nursing: DEBUG

spring:
  datasource:
    url: ${NURSING_CATALOG_DB_URL:jdbc:mysql://localhost:3306/catalog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${NURSING_DB_USERNAME:root}
    password: ${NURSING_DB_PASSWORD:nursing_dev_password_change_me}
  data:
    redis:
      host: ${NURSING_REDIS_HOST:localhost}
  cloud:
    nacos:
      discovery:
        server-addr: ${NURSING_NACOS_ADDR:localhost:8848}

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
