server:
  port: 8084

spring:
  application:
    name: nursing-feedback-service
  config:
    import: optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yaml?group=NURSING&refreshEnabled=true
  datasource:
    url: ${NURSING_FEEDBACK_DB_URL:jdbc:mysql://mysql:3306/feedback_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${NURSING_DB_USERNAME:nursing}
    password: ${NURSING_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
  cloud:
    nacos:
      config:
        server-addr: ${NURSING_NACOS_ADDR:nacos:8848}
        namespace: ${NURSING_NACOS_NAMESPACE:}
        username: ${NURSING_NACOS_USERNAME:}
        password: ${NURSING_NACOS_PASSWORD:}
      discovery:
        server-addr: ${NURSING_NACOS_ADDR:nacos:8848}
        namespace: ${NURSING_NACOS_NAMESPACE:}
        group: NURSING
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
  kafka:
    bootstrap-servers: ${NURSING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      group-id: feedback-group

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nursing.feedback.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

nursing:
  snowflake:
    worker-id: 4
    datacenter-id: 1
  gateway:
    trusted-token: ${NURSING_GATEWAY_TRUSTED_TOKEN:}
  internal:
    token: ${NURSING_INTERNAL_TOKEN:}
