 server:
   port: 8083
 
 spring:
   application:
     name: nursing-order-service
   datasource:
     url: jdbc:mysql://localhost:3306/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
     username: root
     password: root123
     driver-class-name: com.mysql.cj.jdbc.Driver
     hikari:
       maximum-pool-size: 20
       minimum-idle: 5
   data:
     redis:
       host: localhost
       port: 6379
   cloud:
     nacos:
       discovery:
         server-addr: localhost:8848
   kafka:
     bootstrap-servers: localhost:9092
     producer:
       key-serializer: org.apache.kafka.common.serialization.StringSerializer
       value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
     consumer:
       key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
       value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
       group-id: order-group
 
 mybatis:
   mapper-locations: classpath:mapper/*.xml
   type-aliases-package: com.nursing.order.entity
   configuration:
     map-underscore-to-camel-case: true
     log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
 
 nursing:
   snowflake:
     worker-id: 3
     datacenter-id: 1
